*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Arial',sans-serif;background:#0d1b2a;color:#e0e8f0;padding:14px;font-size:13px}
h1{color:#4fc3f7;font-size:1.3rem;margin-bottom:12px;border-bottom:2px solid #1e3a5f;padding-bottom:8px}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tab{padding:5px 12px;background:#1e3a5f;border:1px solid #2d5a8e;border-radius:5px;cursor:pointer;font-size:0.82rem;transition:all 0.15s}

.panel{display:none}.panel.active{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.card{background:#111d2e;border:1px solid #1e3a5f;border-radius:7px;padding:12px}
.card h3{font-size:0.85rem;color:#64b5f6;margin-bottom:8px;border-bottom:1px solid #1e3a5f;padding-bottom:5px}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #162032;font-size:0.82rem}
.val{font-weight:bold;color:#4fc3f7}
.badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:0.72rem;font-weight:bold;margin-left:4px}
.bg{background:#1b4332;color:#6fcf97}.ba{background:#4a3300;color:#f2c94c}
.br{background:#4a1010;color:#eb5757}.bb{background:#0d2137;color:#81d4fa}
.portal{background:#0d2137;border:2px solid #1976d2;border-radius:6px;padding:8px;

.method-box{background:#0a1a2a;border-left:3px solid #4caf50;padding:6px 10px;
             font-size:0.8rem;margin:8px 0;border-radius:0 4px 4px 0;color:#a5d6a7}
canvas{max-height:190px}
.driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px}
.dc{background:#0d2137;border:1px solid #1e3a5f;border-radius:5px;padding:7px}
.dc h4{font-size:0.75rem;color:#64b5f6;margin-bottom:5px}
.diag-table{width:100%;font-size:0.8rem;border-collapse:collapse}
.diag-table td,.diag-table th{padding:4px 8px;border-bottom:1px solid #1e3a5f;text-align:left}
.diag-table th{background:#1e3a5f;color:#90caf9}
.stat-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.72rem;font-weight:bold}

const wks=['Wk1','Wk2','Wk3','Wk4','Wk5','Wk6','Wk7','Wk8','Wk9','Wk10','Wk11','Wk12'];
const CH={};

function badge(txt,cls){return `<span class="badge ${cls}">${txt}</span>`;}

function buildPanel(fn){
  const d=D[fn];
  const q2Cls=d.q2_gp>0.3?'bg':d.q2_gp>0?'ba':'br';
  const nwCls=d.nw_wins?'ba':'bg';
  const nwTxt=d.nw_wins?'NW wins Q²':'GP wins Q²';
  const revCls=d.reversal!=='None'?'br':'bg';
  const revTxt=d.reversal!=='None'?`⚠ ${d.reversal}`:'No reversal';
  
  // IV1 rows
  const iv1rows=d.iv1.map(([xn,r,p,act])=>
    `<div class="row"><span>${xn}</span><span class="val">r=${r>0?'+':''}${r.toFixed(3)} p=${p.toFixed(3)} ${badge(act?'ACTIVE':'noise',act?'bg':'ba')}</span></div>`
  ).join('');
  
  return `
<div class="panel ${fn==1?'active':''}" id="p${fn}">
<div class="g2">
  <div class="card">
    <h3>F${fn} — ${d.desc} (${d.dims}D, n=${d.n})</h3>
    <div class="row"><span>Campaign best</span><span class="val">${d.best}</span></div>
    <div class="row"><span>Initial best</span><span class="val">${d.init_best}</span></div>
    <div class="row"><span>C2 kernel</span><span class="val">${d.kernel} ${badge('Q²='+d.q2_gp.toFixed(3),q2Cls)}</span></div>
    <div class="row"><span>NW kernel Q²</span><span class="val">${d.q2_nw.toFixed(3)} ${badge(nwTxt,nwCls)}</span></div>
    <div class="row"><span>PC1 EVR</span><span class="val">${(d.pca_evr*100).toFixed(1)}% &nbsp; r(PC1,y)=${d.pca_r>0?'+':''}${d.pca_r.toFixed(3)}</span></div>
    <div class="row"><span>Backtest accuracy</span><span class="val">${d.bt_acc}</span></div>
    <div class="row"><span>Bootstrap (weekly-only)</span><span class="val">${badge(revTxt,revCls)}</span></div>
    <div class="row"><span>IV9 silhouette</span><span class="val">${d.hi_sil}</span></div>
    <div class="portal">WK13 QUERY: ${d.portal}</div>
    <div class="method-box">${d.method}</div>
  </div>
  <div class="card"><h3>IV1 — Individual Sensitivity (full combined dataset)</h3>${iv1rows}</div>
</div>
<div class="g3">
  <div class="card"><h3>Weekly Output</h3><canvas id="t${fn}"></canvas></div>
  <div class="card"><h3>Running Campaign Best</h3><canvas id="rb${fn}"></canvas></div>
  <div class="card"><h3>% of Campaign Gain Achieved</h3><canvas id="nm${fn}"></canvas></div>
</div>
<div class="card" style="margin-bottom:12px">
  <h3>Driver Scatter — x_i vs y (all dimensions, full combined dataset)</h3>
  <div class="driver-grid" id="ds${fn}"></div>
</div>
</div>`;
}

// Build all tabs + panels
const tabs=document.getElementById('tabs');
const panels=document.getElementById('panels');
for(let fn=1;fn<=8;fn++){
  const d=D[fn];
  const t=document.createElement('div');
  t.className='tab'+(fn==1?' active':'');
  t.textContent=`F${fn}: ${d.desc}`;
  t.onclick=(f=>e=>showFn(f,e))(fn);
  tabs.appendChild(t);
  panels.innerHTML+=buildPanel(fn);
}

function showFn(fn,e){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('p'+fn).classList.add('active');
  e.target.classList.add('active');
  setTimeout(()=>buildCharts(fn),40);
}

const DARK_OPTS={responsive:true,plugins:{legend:{display:false}},
  scales:{y:{grid:{color:'#1a2840'},ticks:{color:'#8da8c2'}},
           x:{grid:{color:'#1a2840'},ticks:{color:'#8da8c2',font:{size:10}}}}};

function buildCharts(fn){
  const d=D[fn];
  ['t','rb','nm'].forEach(p=>{if(CH[p+fn])CH[p+fn].destroy();});
  const maxV=Math.max(...d.weekly);
  // Trajectory
  CH['t'+fn]=new Chart(document.getElementById('t'+fn),{type:'bar',
    data:{labels:wks,datasets:[{data:d.weekly,
      backgroundColor:d.weekly.map(v=>v===maxV?'#4caf50':'#1976d2'),borderRadius:3}]},options:DARK_OPTS});
  // Running best
  CH['rb'+fn]=new Chart(document.getElementById('rb'+fn),{type:'line',
    data:{labels:wks,datasets:[{data:d.running,borderColor:'#4caf50',
      backgroundColor:'rgba(76,175,80,0.1)',fill:true,tension:0.3,pointRadius:3}]},options:DARK_OPTS});
  // Normalised
  CH['nm'+fn]=new Chart(document.getElementById('nm'+fn),{type:'line',
    data:{labels:wks,datasets:[{data:d.normed,borderColor:'#ff9800',
      backgroundColor:'rgba(255,152,0,0.1)',fill:true,tension:0.3,pointRadius:3}]},
    options:{...DARK_OPTS,scales:{y:{...DARK_OPTS.scales.y,title:{display:true,text:'% gain',color:'#64b5f6'}},
      x:DARK_OPTS.scales.x}}});
  
  // Driver scatters
  const container=document.getElementById('ds'+fn);
  container.innerHTML='';
  Object.entries(d.drivers).forEach(([xn,info])=>{
    const div=document.createElement('div'); div.className='dc';
    const badge=info.active?`<span class="badge bg">r=${info.r>0?'+':''}${info.r.toFixed(3)} ACTIVE</span>`:
                             `<span class="badge ba">r=${info.r.toFixed(3)} noise</span>`;
    div.innerHTML=`<h4>${xn} ${badge}</h4><canvas id="sc_${fn}_${xn}" style="max-height:130px"></canvas>`;
    container.appendChild(div);
    new Chart(document.getElementById(`sc_${fn}_${xn}`),{type:'scatter',
      data:{datasets:[{data:info.x.map((xv,i)=>({x:xv,y:info.y[i]})),
        backgroundColor:info.active?'rgba(76,175,80,0.75)':'rgba(120,130,150,0.5)',pointRadius:3}]},
      options:{responsive:true,plugins:{legend:{display:false}},
        scales:{x:{grid:{color:'#1a2840'},ticks:{color:'#8da8c2'},title:{display:true,text:xn,color:'#64b5f6'}},
                 y:{grid:{color:'#1a2840'},ticks:{color:'#8da8c2'}}}}});
  });
}
window.onload=()=>buildCharts(1);
</script>
</body></html>
